controller_manager:
  ros__parameters:
    update_rate: 100
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_yaw_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    mecanum_wheel_controller:
      type: velocity_controllers/JointGroupVelocityController
arm_controller:
  ros__parameters:
    joints:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
gripper_controller:
  ros__parameters:
    joints:
    - finger_joint1
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
arm_yaw_controller:
  ros__parameters:
    joints:
    - arm_yaw_joint
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
mecanum_wheel_controller:
  ros__parameters:
    joints:
    - front_left_wheel_joint
    - front_right_wheel_joint
    - rear_left_wheel_joint
    - rear_right_wheel_joint
