collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_unfiltered
    cmd_vel_out_topic: /cmd_vel_guarded
    transform_tolerance: 0.2
    source_timeout: 0.6
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons:
    - NearStop
    - FootprintApproach
    NearStop:
      type: polygon
      points:
      - 0.405
      - 0.0
      - 0.3912
      - 0.10482
      - 0.35074
      - 0.2025
      - 0.28638
      - 0.28638
      - 0.2025
      - 0.35074
      - 0.10482
      - 0.3912
      - 0.0
      - 0.405
      - -0.10482
      - 0.3912
      - -0.2025
      - 0.35074
      - -0.28638
      - 0.28638
      - -0.35074
      - 0.2025
      - -0.3912
      - 0.10482
      - -0.405
      - 0.0
      - -0.3912
      - -0.10482
      - -0.35074
      - -0.2025
      - -0.28638
      - -0.28638
      - -0.2025
      - -0.35074
      - -0.10482
      - -0.3912
      - -0.0
      - -0.405
      - 0.10482
      - -0.3912
      - 0.2025
      - -0.35074
      - 0.28638
      - -0.28638
      - 0.35074
      - -0.2025
      - 0.3912
      - -0.10482
      action_type: stop
      max_points: 3
      visualize: true
      polygon_pub_topic: /collision_stop_zone
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /navigation/collision_footprint
      time_before_collision: 2.0
      simulation_time_step: 0.05
      max_points: 3
    observation_sources:
    - left
    - right
    left:
      type: scan
      topic: /scan_left
      enabled: true
    right:
      type: scan
      topic: /scan_right
      enabled: true
