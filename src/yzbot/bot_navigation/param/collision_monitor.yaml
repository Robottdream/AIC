collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_unfiltered
    cmd_vel_out_topic: /cmd_vel_guarded
    transform_tolerance: 0.2
    source_timeout: 0.6
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: [NearStop, FootprintApproach]
    # Front edge stays short of the block face at the 0.55 m grasp offset.
    NearStop:
      type: polygon
      points: [0.38, 0.42, 0.38, -0.42, -0.4, -0.42, -0.4, 0.42]
      action_type: stop
      max_points: 3
      visualize: true
      polygon_pub_topic: /collision_stop_zone
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 2.0
      simulation_time_step: 0.05
      max_points: 3
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
      enabled: true
