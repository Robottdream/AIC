amcl:
  ros__parameters:
    use_sim_time: true
    set_initial_pose: true
    initial_pose.x: 0.0
    initial_pose.y: 0.0
    initial_pose.yaw: 0.0
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::OmniMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: false
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
amcl_map_client:
  ros__parameters:
    use_sim_time: true
amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: true
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    default_nav_to_pose_bt_xml: ''
    bt_loop_duration: 10
    default_server_timeout: 200
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node
bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: true
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 3.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 20.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      trajectory_generator_name: bot_navigation::FineOmniTrajectoryGenerator
      debug_trajectory_details: false
      min_vel_x: -4.0
      max_vel_x: 4.0
      min_vel_y: -4.0
      max_vel_y: 4.0
      max_vel_theta: 0.0
      min_speed_xy: 0.0
      max_speed_xy: 4.0
      min_speed_theta: 0.0
      acc_lim_x: 2.0
      acc_lim_y: 2.0
      acc_lim_theta: 2.4
      decel_lim_x: -5.0
      decel_lim_y: -5.0
      decel_lim_theta: -3.2
      vx_samples: 11
      vy_samples: 11
      vtheta_samples: 1
      sim_time: 1.8
      include_last_point: true
      discretize_by_time: true
      time_granularity: 0.05
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.1
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - Oscillation
      - ObstacleFootprint
      - PredictiveObstacle
      - PathFollow
      PathFollow.class: bot_navigation::PathFollowCritic
      PathFollow.scale: 24.0
      PathFollow.lookahead_distance: 2.6
      PathFollow.control_horizon: 0.6
      PathFollow.max_prefix_deviation: 0.12
      ObstacleFootprint.scale: 0.05
      PredictiveObstacle.class: bot_navigation::PredictiveObstacleCritic
      PredictiveObstacle.scale: 12.0
      PredictiveObstacle.margin: 0.08
      PredictiveObstacle.influence_distance: 0.35
      PredictiveObstacle.max_observation_age: 0.35
      forward_prune_distance: 8.0
      PathFollow.max_path_chord_deviation: 0.06
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: true
      rolling_window: true
      width: 18
      height: 18
      resolution: 0.05
      footprint: '[[0.45, 0], [0.434667, 0.116469], [0.389711, 0.225], [0.318198,
        0.318198], [0.225, 0.389711], [0.116469, 0.434667], [0, 0.45], [-0.116469,
        0.434667], [-0.225, 0.389711], [-0.318198, 0.318198], [-0.389711, 0.225],
        [-0.434667, 0.116469], [-0.45, 0], [-0.434667, -0.116469], [-0.389711, -0.225],
        [-0.318198, -0.318198], [-0.225, -0.389711], [-0.116469, -0.434667], [-0,
        -0.45], [0.116469, -0.434667], [0.225, -0.389711], [0.318198, -0.318198],
        [0.389711, -0.225], [0.434667, -0.116469]]'
      footprint_padding: 0.01
      plugins:
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.0
        inflation_radius: 1.0
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: left right
        left:
          topic: /scan_left
          max_obstacle_height: 2.0
          inf_is_valid: true
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 9.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
        right:
          topic: /scan_right
          max_obstacle_height: 2.0
          inf_is_valid: true
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 9.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: true
      always_send_full_costmap: true
  local_costmap_client:
    ros__parameters:
      use_sim_time: true
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: true
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      footprint: '[[0.45, 0], [0.434667, 0.116469], [0.389711, 0.225], [0.318198,
        0.318198], [0.225, 0.389711], [0.116469, 0.434667], [0, 0.45], [-0.116469,
        0.434667], [-0.225, 0.389711], [-0.318198, 0.318198], [-0.389711, 0.225],
        [-0.434667, 0.116469], [-0.45, 0], [-0.434667, -0.116469], [-0.389711, -0.225],
        [-0.318198, -0.318198], [-0.225, -0.389711], [-0.116469, -0.434667], [-0,
        -0.45], [0.116469, -0.434667], [0.225, -0.389711], [0.318198, -0.318198],
        [0.389711, -0.225], [0.434667, -0.116469]]'
      footprint_padding: 0.01
      resolution: 0.05
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      - known_trajectory_layer
      known_trajectory_layer:
        plugin: bot_navigation::KnownTrajectoryLayer
        enabled: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: left right
        left:
          topic: /scan_left
          max_obstacle_height: 2.0
          inf_is_valid: true
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 9.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
        right:
          topic: /scan_right
          max_obstacle_height: 2.0
          inf_is_valid: true
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 9.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.0
        inflation_radius: 1.0
      always_send_full_costmap: true
  global_costmap_client:
    ros__parameters:
      use_sim_time: true
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: true
map_server:
  ros__parameters:
    yaml_filename: ''
    use_sim_time: true
map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: true
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.3
      use_astar: false
      allow_unknown: true
planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 15.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
robot_state_publisher:
  ros__parameters:
    use_sim_time: true
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    max_velocity:
    - 4.0
    - 4.0
    - 1.5
    max_accel:
    - 2.0
    - 2.0
    - 2.4
    max_decel:
    - -5.0
    - -5.0
    - -3.2
    min_velocity:
    - -4.0
    - -4.0
    - -1.5
scan_velocity_guard:
  ros__parameters:
    max_linear_speed: 4.0
    collision_footprint_radius: 0.325
    prediction_horizon: 1.8
